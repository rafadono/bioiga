name: Release to PyPI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & Format Check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Check formatting
        run: ruff format --check .
      - name: Check lint
        run: ruff check .

  # ---------------------------------------------------------------------------
  # 2. Test suite + coverage
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin and build iga-core
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-cov numpy scipy matplotlib optuna pandas seaborn
          cd iga_core && maturin develop --release && cd ..

      - name: Install suite in editable mode
        run: pip install -e .

      - name: Run tests with coverage
        run: |
          python -m pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'   # Upload once only
        with:
          files: coverage.xml
          fail_ci_if_error: false              # Don't break CI if Codecov is down

  # ---------------------------------------------------------------------------
  # 3. Type checking (mypy)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mypy and stubs
        run: pip install mypy numpy
      - name: Run mypy
        # Check each pure-Python package; iga_core has Rust so ignore-missing-imports
        run: |
          mypy mpmbso/mpmbso --ignore-missing-imports --no-strict-optional
          mypy mpga/mpga     --ignore-missing-imports --no-strict-optional
          mypy mpbfa/mpbfa   --ignore-missing-imports --no-strict-optional
          mypy mpbgwo/mpbgwo --ignore-missing-imports --no-strict-optional
          mypy mpbba/mpbba   --ignore-missing-imports --no-strict-optional

  # ---------------------------------------------------------------------------
  # 4. Build iga-core platform wheels
  # ---------------------------------------------------------------------------
  build-iga-core:
    name: Build iga-core (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build iga-core wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path iga_core/Cargo.toml
          manylinux: auto
          sccache: 'true'

      - name: Upload iga-core wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-iga-core-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 5. Build bioiga pure-Python wheel
  # ---------------------------------------------------------------------------
  build-bioiga:
    name: Build bioiga pure-Python wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel
      - name: Upload bioiga wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-bioiga
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # 6. Publish all wheels to PyPI (version tags only)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-iga-core, build-bioiga]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels to be published
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
