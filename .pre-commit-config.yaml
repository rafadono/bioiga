repos:
  # Ruff — linter + formatter (replaces flake8, black, isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix]          # Auto-fix safe issues
      - id: ruff-format        # Format code

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements    # Catch leftover breakpoint() / pdb.set_trace()
      - id: check-added-large-files
        args: [--maxkb=1000]   # Block files > 1MB (e.g. accidental .pyd commits)

  # Mypy type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [numpy]
        args: [--ignore-missing-imports, --no-strict-optional]
        files: ^(mpmbso/mpmbso|mpga/mpga|mpbfa/mpbfa|mpbgwo/mpbgwo|mpbba/mpbba)/.*\.py$
