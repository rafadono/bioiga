[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpmbso"
version = "0.2.0"
description = "Multi-Population Modified Binary Particle Swarm Optimization (MPMBPSO) — part of the BioIGA-2D suite"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Rafael Inostroza" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.4",
    "matplotlib>=3.8.2",
    "optuna>=3.5.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.2",
    "bioiga>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mpmbso"]
