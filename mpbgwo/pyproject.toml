[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mpbgwo"
version = "0.2.0"
description = "Multi-Population Binary Grey Wolf Optimizer (MPBGWO) for discrete and binary optimization"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Rafael Inostroza" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.4",
    "matplotlib>=3.8.2",
    "optuna>=3.5.0",
    "pandas>=2.2.0",
    "seaborn>=0.13.2",
]

[tool.hatch.build.targets.wheel]
packages = ["mpbgwo"]
