[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "iga-core"
version = "0.2.0"
description = "Isogeometric Analysis (IGA) 2D core package with Rust-optimized backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Rafael Inostroza" }
]
keywords = [
    "isogeometric-analysis", "IGA", "NURBS", "topology-optimization",
    "structural-optimization", "phononic-crystals", "bandgap", "metamaterials",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "matplotlib>=3.8.2",
    "optuna>=3.5.0",
    "pandas>=2.2.0",
]

[project.scripts]
iga-run = "iga_core.main:main"

[tool.maturin]
python-source = "."
module-name = "iga_core.iga_rust"
